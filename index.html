<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; color: #1c1e21; padding-bottom: 50px; }
    header { background: #1a365d; color: white; padding: 18px 20px; text-align: center; }
    header h1 { font-size: 1.4rem; }
    
    .tabs-wrapper { display: flex; align-items: center; background: #2b6cb0; padding: 8px 12px; gap: 8px; overflow-x: auto; }
    .tab-btn { background: rgba(255, 255, 255, 0.15); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: white; color: #1a365d; font-weight: bold; }
    .add-section-btn { background: #38a169; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-weight: bold; white-space: nowrap; }

    .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-primary { background: #2b6cb0; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; width: 100%; }

    .form-card { display: none; background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-card.active { display: block; }
    .form-card h2 { font-size: 1.15rem; margin-bottom: 12px; color: #1a365d; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; }
    .submit-btn { background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }

    .lecture-card { background: white; border-radius: 10px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .player-box { width: 100%; height: 220px; background: #000; }
    video, iframe { width: 100%; height: 100%; border: none; }
    .lecture-info { padding: 14px; }
    .lecture-info h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .lecture-info p { font-size: 0.85rem; color: #65676b; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { display: inline-block; background: #2b6cb0; color: white; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; border: none; cursor: pointer; }
    .delete-btn { background: #e53e3e; }
    .empty-state { text-align: center; color: #718096; padding: 30px 0; }
  </style>
</head>
<body>

  <header>
    <h1>Lecture Hub Portal</h1>
  </header>

  <div class="tabs-wrapper" id="tabsList"></div>

  <div class="container">
    <div class="toolbar">
      <button class="btn-primary" onclick="toggleUploadForm()">+ Upload / Add Lecture</button>
    </div>

    <!-- Upload Form -->
    <div class="form-card" id="uploadForm">
      <h2>Add Lecture</h2>
      <div class="form-group">
        <label>Subject</label>
        <select id="lectureSubjectSelect"></select>
      </div>
      <div class="form-group">
        <label>Lecture Title</label>
        <input type="text" id="lectureTitle" placeholder="e.g. Political Science Lecture 1" />
      </div>
      <div class="form-group">
        <label>Duration</label>
        <input type="text" id="lectureDuration" placeholder="e.g. 2h 15m" />
      </div>
      <div class="form-group">
        <label>Select Offline Video File (.mp4 from phone)</label>
        <input type="file" id="localVideoFile" accept="video/mp4,video/*" />
        <small style="color: #4a5568; font-size: 0.78rem;">Upload an MP4 directly from your phone to store and watch it 100% offline.</small>
      </div>
      <div class="form-group">
        <label>OR Paste YouTube Link</label>
        <input type="text" id="lectureYtUrl" placeholder="https://youtu.be/..." />
      </div>
      <div class="form-group">
        <label>PDF Notes Link (Google Drive / URL)</label>
        <input type="text" id="lecturePdf" placeholder="https://drive.google.com/..." />
      </div>
      <button class="submit-btn" id="saveBtn" onclick="saveLecture()">Save Lecture</button>
    </div>

    <div id="sectionsContainer"></div>
  </div>

  <script>
    // Storage Engine (IndexedDB)
    const DB_NAME = 'LectureAppDB';
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveVideoBlob(id, blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('videos', 'readwrite');
        tx.objectStore('videos').put(blob, id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getVideoBlob(id) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('videos', 'readonly');
          const req = tx.objectStore('videos').get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function deleteVideoBlob(id) {
      try {
        const db = await openDB();
        const tx = db.transaction('videos', 'readwrite');
        tx.objectStore('videos').delete(id);
      } catch(e) {}
    }

    // Portal State
    let sections = JSON.parse(localStorage.getItem('sections_list')) || ['History', 'Economics', 'Geography', 'Political Science'];
    let lectures = JSON.parse(localStorage.getItem('lectures_list')) || [
      {
        id: 'init_1',
        subject: 'History',
        title: 'History Lecture 1: Ancient Civilization',
        duration: '2h 15m',
        type: 'youtube',
        videoData: 'dQw4w9WgXcQ',
        pdfUrl: '#'
      }
    ];
    let currentSection = sections[0];

    function renderTabs() {
      const wrapper = document.getElementById('tabsList');
      wrapper.innerHTML = '';

      sections.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn ' + (sec === currentSection ? 'active' : '');
        btn.innerText = sec;
        btn.onclick = () => { currentSection = sec; renderTabs(); renderLectures(); };
        wrapper.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-section-btn';
      addBtn.innerText = '+ New Subject';
      addBtn.onclick = promptNewSection;
      wrapper.appendChild(addBtn);

      updateDropdown();
    }

    function promptNewSection() {
      const name = prompt('Enter new subject name:');
      if (name && !sections.includes(name.trim())) {
        sections.push(name.trim());
        localStorage.setItem('sections_list', JSON.stringify(sections));
        currentSection = name.trim();
        renderTabs();
        renderLectures();
      }
    }

    function updateDropdown() {
      const sel = document.getElementById('lectureSubjectSelect');
      sel.innerHTML = '';
      sections.forEach(sec => {
        const opt = document.createElement('option');
        opt.value = sec;
        opt.innerText = sec;
        sel.appendChild(opt);
      });
      sel.value = currentSection;
    }

    function toggleUploadForm() {
      document.getElementById('uploadForm').classList.toggle('active');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(reg);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    async function saveLecture() {
      const subject = document.getElementById('lectureSubjectSelect').value;
      const title = document.getElementById('lectureTitle').value.trim();
      const duration = document.getElementById('lectureDuration').value.trim() || '2h 00m';
      const fileInput = document.getElementById('localVideoFile');
      const ytUrl = document.getElementById('lectureYtUrl').value.trim();
      const pdfUrl = document.getElementById('lecturePdf').value.trim() || '#';

      if (!title) {
        alert('Please give the lecture a title.');
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving to storage...';

      const lectureId = 'lec_' + Date.now();

      if (fileInput.files && fileInput.files[0]) {
        // Save raw video directly inside IndexedDB for offline playing
        const file = fileInput.files[0];
        await saveVideoBlob(lectureId, file);
        lectures.push({
          id: lectureId,
          subject,
          title,
          duration,
          type: 'offline',
          videoData: lectureId,
          pdfUrl
        });
      } else if (ytUrl) {
        const ytId = extractYouTubeId(ytUrl) || ytUrl;
        lectures.push({
          id: lectureId,
          subject,
          title,
          duration,
          type: 'youtube',
          videoData: ytId,
          pdfUrl
        });
      } else {
        alert('Please provide either an MP4 video file or a YouTube link.');
        saveBtn.disabled = false;
        saveBtn.innerText = 'Save Lecture';
        return;
      }

      localStorage.setItem('lectures_list', JSON.stringify(lectures));

      // Reset form
      document.getElementById('lectureTitle').value = '';
      document.getElementById('lectureDuration').value = '';
      document.getElementById('localVideoFile').value = '';
      document.getElementById('lectureYtUrl').value = '';
      document.getElementById('lecturePdf').value = '';
      document.getElementById('uploadForm').classList.remove('active');
      saveBtn.disabled = false;
      saveBtn.innerText = 'Save Lecture';

      currentSection = subject;
      renderTabs();
      renderLectures();
    }

    async function deleteLecture(id) {
      if (confirm('Delete this lecture?')) {
        await deleteVideoBlob(id);
        lectures = lectures.filter(l => l.id !== id);
        localStorage.setItem('lectures_list', JSON.stringify(lectures));
        renderLectures();
      }
    }

    async function renderLectures() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      const items = lectures.filter(l => l.subject === currentSection);
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state">No lectures in <strong>${currentSection}</strong>.<br>Tap <em>+ Upload / Add Lecture</em> to add one.</div>`;
        return;
      }

      for (const lec of items) {
        const card = document.createElement('div');
        card.className = 'lecture-card';

        let mediaHtml = '';
        if (lec.type === 'offline') {
          const blob = await getVideoBlob(lec.videoData);
          if (blob) {
            const url = URL.createObjectURL(blob);
            mediaHtml = `<video controls playsinline src="${url}"></video>`;
          } else {
            mediaHtml = `<div style="color:white;display:flex;align-items:center;justify-content:center;height:100%;">Video file not found in local storage</div>`;
          }
        } else {
          mediaHtml = `<iframe src="https://www.youtube.com/embed/${lec.videoData}" allowfullscreen></iframe>`;
        }

        card.innerHTML = `
          <div class="player-box">${mediaHtml}</div>
          <div class="lecture-info">
            <h3>${lec.title}</h3>
            <p>Duration: ${lec.duration} ${lec.type === 'offline' ? '• <strong style="color:#28a745;">Offline Ready</strong>' : ''}</p>
            <div class="btn-row">
              <a href="${lec.pdfUrl}" class="action-btn" target="_blank">PDF Notes</a>
              <button class="action-btn delete-btn" onclick="deleteLecture('${lec.id}')">Remove</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    // Initialize UI
    renderTabs();
    renderLectures();
  </script>
</body>
</html>
